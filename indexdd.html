<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krātuve — Fishing Planet uzziņa</title>
<style>
  :root{
    --deep:#0b1f26;
    --deep2:#0f2a33;
    --panel:#12313b;
    --panel-line:#1e4552;
    --ink:#eaf3f0;
    --ink-dim:#9fbcb8;
    --amber:#e8a33d;
    --amber-dim:#c9863f;
    --line:#e8a33d33;
    --rust:#c1613a;
    --good:#6fae7c;
    --font-display: 'Iowan Old Style','Palatino Linotype', Georgia, serif;
    --font-body: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #143842 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #0e2830 0%, transparent 55%),
      var(--deep);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
  }
  a{color:inherit;}
  ::selection{background:var(--amber); color:#0b1f26;}

  /* subtle water-ripple texture in background */
  .ripples{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.10;
    background-image:
      repeating-radial-gradient(circle at 20% 30%, transparent 0 40px, #ffffff10 41px 42px, transparent 43px 90px),
      repeating-radial-gradient(circle at 80% 75%, transparent 0 60px, #ffffff0c 61px 62px, transparent 63px 130px);
    animation: drift 40s linear infinite;
  }
  @keyframes drift{ from{background-position:0 0,0 0;} to{background-position:200px 100px,-160px -140px;} }

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, #0d242bee, #0d242bcc 80%, transparent);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--panel-line);
    padding:14px 20px 0 20px;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px; max-width:1180px; margin:0 auto; padding-bottom:12px;
  }
  .brand .mark{font-size:22px;}
  .brand h1{
    font-family:var(--font-display); font-weight:600; font-size:22px; letter-spacing:.02em;
    margin:0; color:var(--ink);
  }
  .brand .sub{
    font-size:12px; color:var(--ink-dim); font-family:var(--font-mono); letter-spacing:.03em;
    margin-left:auto; text-align:right;
  }
  nav.tabs{
    max-width:1180px; margin:0 auto; display:flex; gap:2px; overflow-x:auto;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:transparent; border:none; color:var(--ink-dim);
    font-family:var(--font-mono); font-size:13px; letter-spacing:.04em;
    padding:10px 16px; cursor:pointer; white-space:nowrap;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{color:var(--amber); border-bottom-color:var(--amber);}

  main{max-width:1180px; margin:0 auto; padding:22px 20px 80px; position:relative; z-index:1;}

  .toolbar{
    display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap;
  }
  .search{
    flex:1; min-width:220px;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:3px;
    padding:10px 14px; color:var(--ink); font-family:var(--font-body); font-size:14px;
  }
  .search:focus{outline:none; border-color:var(--amber);}
  select.filter{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:3px;
    padding:10px 12px; color:var(--ink-dim); font-family:var(--font-mono); font-size:12.5px;
  }
  .count-tag{
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);
    border:1px solid var(--panel-line); padding:6px 10px; border-radius:20px; white-space:nowrap;
  }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:12px;
  }
  .card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:4px;
    overflow:hidden; cursor:pointer; text-align:left;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column;
  }
  .card:hover{transform:translateY(-2px); border-color:var(--amber-dim); box-shadow:0 8px 22px #00000055;}
  .card .thumb{
    aspect-ratio:1/1; background:#0a1e24 url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\"/>');
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .card .thumb img{width:100%; height:100%; object-fit:contain; padding:10px;}
  .card .thumb .ph{color:var(--panel-line); font-size:11px; font-family:var(--font-mono);}
  .card .body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:3px; flex:1;}
  .card .title{font-family:var(--font-display); font-size:14.5px; font-weight:600; line-height:1.25;}
  .card .meta{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); letter-spacing:.02em;}
  .card .tag{
    align-self:flex-start; margin-top:auto; font-family:var(--font-mono); font-size:10px;
    color:var(--amber); border:1px solid var(--line); padding:2px 7px; border-radius:20px;
  }

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-dim); font-family:var(--font-mono); font-size:13px;
  }

  /* modal / detail */
  .overlay{
    position:fixed; inset:0; background:#050f13cc; backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px;
    overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .detail{
    background:var(--deep2); border:1px solid var(--panel-line); border-radius:6px;
    max-width:760px; width:100%; overflow:hidden;
    box-shadow:0 30px 70px #000000aa;
  }
  .detail .hero{
    display:flex; gap:20px; padding:26px; background:linear-gradient(135deg,#123039,#0d2229);
    border-bottom:1px solid var(--panel-line); position:relative;
  }
  .detail .hero img{width:150px; height:150px; object-fit:contain; background:#08181d; border-radius:4px; padding:8px; flex-shrink:0;}
  .detail .hero .htext{flex:1; min-width:0;}
  .detail .hero h2{font-family:var(--font-display); font-size:26px; margin:0 0 4px;}
  .detail .hero .latin{font-style:italic; color:var(--ink-dim); font-size:13.5px; margin-bottom:10px;}
  .detail .hero .stats{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;}
  .detail .hero .stat{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);}
  .detail .hero .stat b{color:var(--amber); display:block; font-size:14px; font-family:var(--font-body);}
  .detail .close{
    position:absolute; top:14px; right:16px; background:none; border:none; color:var(--ink-dim);
    font-size:22px; cursor:pointer; line-height:1;
  }
  .detail .close:hover{color:var(--amber);}
  .detail .content{padding:22px 26px 26px; font-size:14.5px; line-height:1.65; color:#d7e6e2;}
  .detail .content p{margin:0 0 12px;}
  .detail h3.section{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--amber); margin:22px 0 10px; padding-top:14px; border-top:1px solid var(--panel-line);
  }
  .detail h3.section:first-of-type{border-top:none; margin-top:4px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--panel-line);
    border-radius:20px; padding:5px 12px 5px 5px; font-size:12.5px; cursor:pointer;
  }
  .chip:hover{border-color:var(--amber-dim);}
  .chip img{width:26px; height:26px; object-fit:contain; border-radius:50%; background:#08181d;}
  .chip .noimg{width:26px; height:26px; border-radius:50%; background:#08181d;}

  footer{
    max-width:1180px; margin:40px auto 0; padding:20px; color:var(--ink-dim);
    font-family:var(--font-mono); font-size:11px; border-top:1px solid var(--panel-line); text-align:center;
  }
  .banner{
    max-width:1180px; margin:0 auto 18px; padding:12px 16px; border:1px dashed var(--panel-line);
    border-radius:4px; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim); line-height:1.6;
  }
  .banner b{color:var(--amber);}

  @media (max-width:560px){
    .brand .sub{display:none;}
    .detail .hero{flex-direction:column;}
    .detail .hero img{width:110px; height:110px;}
  }
</style>
</head>
<body>
<div class="ripples"></div>

<header>
  <div class="brand">
    <span class="mark">&#127907;</span>
    <h1>Krātuve <span style="color:var(--ink-dim); font-weight:400;">/ Fishing Planet uzziņa</span></h1>
    <span class="sub" id="metaLine">ielādē...</span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div class="banner" id="dataBanner"></div>
  <div class="toolbar">
    <input class="search" id="searchBox" type="text" placeholder="Meklēt...">
    <select class="filter" id="filterSelect"></select>
    <span class="count-tag" id="countTag"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">Nekas netika atrasts.</div>
</main>

<footer>fp-collective offline krātuve &middot; dati no fp-collective.com API eksporta &middot; bildes tiek ielādētas no interneta, ja tas ir pieejams</footer>

<div class="overlay" id="overlay">
  <div class="detail" id="detailBox"></div>
</div>

<script id="fpc-data" type="application/json">
__DATA_JSON__
</script>

<script>
const DATA = JSON.parse(document.getElementById('fpc-data').textContent);

const TABS = [
  {key:'fish', label:'Zivis', icon:'&#128031;'},
  {key:'baits', label:'Ēsmas', icon:'&#129440;'},
  {key:'lures', label:'Lūri', icon:'&#129521;'},
  {key:'hooks', label:'Āķi', icon:'&#127907;'},
  {key:'luretypes', label:'Lūru tipi', icon:'&#128736;'},
  {key:'places', label:'Vietas', icon:'&#128506;'},
];

let state = { tab:'fish', query:'', filter:'' };

// ---- lookups ----
const byId = {};
['fish','baits','lures','hooks','luretypes','places'].forEach(k=>{
  byId[k] = {};
  DATA[k].forEach(item=>{ byId[k][item.id] = item; });
});

function placeholderThumb(){
  return `<div class="ph">no image</div>`;
}

function imgTag(url, alt){
  if(!url) return placeholderThumb();
  return `<img src="${url}" alt="${escapeHtml(alt||'')}" loading="lazy" onerror="this.parentElement.innerHTML=placeholderThumb()">`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stripTags(s){
  return (s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
}

// ---- filter options per tab ----
function filterOptionsFor(tab){
  if(tab==='baits') return uniqueVals(DATA.baits,'baitType');
  if(tab==='lures') return uniqueVals(DATA.lures,'lureType');
  if(tab==='hooks') return uniqueVals(DATA.hooks,'type');
  if(tab==='places') return uniqueVals(DATA.places,'type');
  return [];
}
function uniqueVals(arr, field){
  const s = new Set();
  arr.forEach(x=>{ if(x[field]) s.add(x[field]); });
  return Array.from(s).sort();
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>
    `<button data-tab="${t.key}" class="${t.key===state.tab?'active':''}">${t.icon} ${t.label} <span style="opacity:.5">(${DATA[t.key].length})</span></button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ state.tab=b.dataset.tab; state.query=''; state.filter=''; document.getElementById('searchBox').value=''; render(); };
  });
}

function renderFilter(){
  const sel = document.getElementById('filterSelect');
  const opts = filterOptionsFor(state.tab);
  if(opts.length===0){ sel.style.display='none'; return; }
  sel.style.display='';
  sel.innerHTML = `<option value="">visi tipi</option>` + opts.map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
  sel.value = state.filter;
  sel.onchange = ()=>{ state.filter = sel.value; render(); };
}

function matchesQuery(item, q){
  if(!q) return true;
  const hay = (item.title||'') + ' ' + (item.latinName||'') + ' ' + (item.locationName||'');
  return hay.toLowerCase().includes(q.toLowerCase());
}
function matchesFilter(item, tab, f){
  if(!f) return true;
  if(tab==='baits') return item.baitType===f;
  if(tab==='lures') return item.lureType===f;
  if(tab==='hooks') return item.type===f;
  if(tab==='places') return item.type===f;
  return true;
}

function cardFor(tab, item){
  if(tab==='fish'){
    return `<div class="card" data-open="fish:${item.id}">
      <div class="thumb">${imgTag(item.image, item.title)}</div>
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${escapeHtml(item.latinName||'')}</div>
      </div>
    </div>`;
  }
  if(tab==='baits'){
    return `<div class="card" data-open="baits:${item.id}">
      <div class="thumb">${imgTag(item.image, item.title)}</div>
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${escapeHtml(item.baitType||'')}${item.weight?' &middot; '+escapeHtml(item.weight):''}</div>
        ${item.targetFish?`<div class="tag">${escapeHtml(item.targetFish)}</div>`:''}
      </div>
    </div>`;
  }
  if(tab==='lures'){
    return `<div class="card" data-open="lures:${item.id}">
      <div class="thumb">${imgTag(item.image, item.title)}</div>
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${escapeHtml(item.lureType||'')}${item.weight?' &middot; '+item.weight+'g':''}</div>
      </div>
    </div>`;
  }
  if(tab==='hooks'){
    return `<div class="card" data-open="hooks:${item.id}">
      <div class="thumb">${imgTag(item.image, item.title)}</div>
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${escapeHtml(item.type||'')}${item.size?' &middot; '+escapeHtml(item.size):''}</div>
      </div>
    </div>`;
  }
  if(tab==='luretypes'){
    return `<div class="card" data-open="luretypes:${item.id}">
      <div class="thumb">${imgTag(item.image, item.title)}</div>
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
      </div>
    </div>`;
  }
  if(tab==='places'){
    return `<div class="card" data-open="places:${item.id}">
      <div class="thumb">${imgTag(item.image, item.title)}</div>
      <div class="body">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${escapeHtml(item.locationName||'')}${item.type?' &middot; '+escapeHtml(item.type):''}</div>
        <div class="tag">${(item.fishIds||[]).length} zivju sugas</div>
      </div>
    </div>`;
  }
  return '';
}

function render(){
  renderTabs();
  renderFilter();
  const grid = document.getElementById('grid');
  const list = DATA[state.tab].filter(i => matchesQuery(i, state.query) && matchesFilter(i, state.tab, state.filter));
  document.getElementById('countTag').textContent = `${list.length} / ${DATA[state.tab].length} rāda`;
  grid.innerHTML = list.map(i=>cardFor(state.tab,i)).join('');
  document.getElementById('emptyMsg').style.display = list.length? 'none':'block';
  grid.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{
      const [tab,id] = el.dataset.open.split(':');
      openDetail(tab, Number(id));
    };
  });
}

function chipsForIds(tab, ids){
  if(!ids || !ids.length) return '<span style="color:var(--ink-dim); font-size:12.5px;">nav zināms šajā datu izlasē</span>';
  return `<div class="chip-row">` + ids.map(id=>{
    const it = byId[tab][id];
    if(!it) return `<div class="chip"><div class="noimg"></div>#${id} (nav ielādēts)</div>`;
    return `<div class="chip" data-open="${tab}:${id}">${it.image?`<img src="${it.image}" onerror="this.style.display='none'">`:`<div class="noimg"></div>`}${escapeHtml(it.title)}</div>`;
  }).join('') + `</div>`;
}

function openDetail(tab, id){
  const item = byId[tab][id];
  if(!item) return;
  const box = document.getElementById('detailBox');
  box.innerHTML = detailHtmlFor(tab, item);
  document.getElementById('overlay').classList.add('open');
  box.querySelectorAll('.close').forEach(b=>b.onclick=closeDetail);
  box.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{ const [t,i]=el.dataset.open.split(':'); openDetail(t, Number(i)); };
  });
}
function closeDetail(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeDetail(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });

function detailHtmlFor(tab, item){
  if(tab==='fish'){
    return `
      <div class="hero">
        <button class="close">&times;</button>
        ${imgTag(item.image, item.title).replace('<img','<img style="width:150px;height:150px;object-fit:contain;background:#08181d;border-radius:4px;padding:8px;"')}
        <div class="htext">
          <h2>${escapeHtml(item.title)}</h2>
          <div class="latin">${escapeHtml(item.latinName||'')}</div>
          <div class="stats">
            ${item.maxWeight? `<div class="stat"><b>${item.maxWeight} kg</b>maks. svars</div>`:''}
            <div class="stat"><b>${item.baitIds.length}</b>zināmas ēsmas</div>
            <div class="stat"><b>${item.lureIds.length}</b>zināmi lūri</div>
          </div>
        </div>
      </div>
      <div class="content">
        ${item.content?`<div>${item.content}</div>`:''}
        ${item.howToCatch?`<h3 class="section">Kā noķert</h3><div>${item.howToCatch}</div>`:''}
        <h3 class="section">Ēsmas</h3>
        ${chipsForIds('baits', item.baitIds)}
        <h3 class="section">Lūri</h3>
        ${chipsForIds('lures', item.lureIds)}
      </div>
    `;
  }
  if(tab==='baits'){
    return `
      <div class="hero">
        <button class="close">&times;</button>
        ${imgTag(item.image, item.title).replace('<img','<img style="width:150px;height:150px;object-fit:contain;background:#08181d;border-radius:4px;padding:8px;"')}
        <div class="htext">
          <h2>${escapeHtml(item.title)}</h2>
          <div class="latin">${escapeHtml(item.baitType||'')}</div>
          <div class="stats">
            ${item.weight?`<div class="stat"><b>${escapeHtml(item.weight)}</b>svars</div>`:''}
            <div class="stat"><b>${item.basePrice||0}</b>cena (game gold)</div>
            ${item.baseLevel?`<div class="stat"><b>${item.baseLevel}</b>līmenis</div>`:''}
          </div>
        </div>
      </div>
      <div class="content">
        ${item.targetFish?`<h3 class="section">Mērķa zivs</h3><p>${escapeHtml(item.targetFish)}</p>`:''}
        ${item.howToGet && item.howToGet.length?`<h3 class="section">Kā iegūt</h3><p>${item.howToGet.map(escapeHtml).join(', ')}</p>`:''}
      </div>
    `;
  }
  if(tab==='lures'){
    return `
      <div class="hero">
        <button class="close">&times;</button>
        ${imgTag(item.image, item.title).replace('<img','<img style="width:150px;height:150px;object-fit:contain;background:#08181d;border-radius:4px;padding:8px;"')}
        <div class="htext">
          <h2>${escapeHtml(item.title)}</h2>
          <div class="latin">${escapeHtml(item.lureType||'')}${item.color?' &middot; '+escapeHtml(item.color):''}</div>
          <div class="stats">
            ${item.weight?`<div class="stat"><b>${item.weight} g</b>svars</div>`:''}
            ${item.length?`<div class="stat"><b>${item.length} cm</b>garums</div>`:''}
            ${item.depth?`<div class="stat"><b>${item.depth} m</b>dziļums</div>`:''}
            ${item.hookSize?`<div class="stat"><b>${escapeHtml(item.hookSize)}</b>āķa izmērs</div>`:''}
          </div>
        </div>
      </div>
      <div class="content">
        <h3 class="section">Cena</h3>
        <p>${item.basePrice||0} game gold${item.baitcoinPrice?` &middot; ${item.baitcoinPrice} baitcoin`:''}</p>
        ${item.howToGet && item.howToGet.length?`<h3 class="section">Kā iegūt</h3><p>${item.howToGet.map(escapeHtml).join(', ')}</p>`:''}
      </div>
    `;
  }
  if(tab==='hooks'){
    return `
      <div class="hero">
        <button class="close">&times;</button>
        ${imgTag(item.image, item.title).replace('<img','<img style="width:150px;height:150px;object-fit:contain;background:#08181d;border-radius:4px;padding:8px;"')}
        <div class="htext">
          <h2>${escapeHtml(item.title)}</h2>
          <div class="latin">${escapeHtml(item.type||'')}</div>
          <div class="stats">
            ${item.size?`<div class="stat"><b>${escapeHtml(item.size)}</b>izmērs</div>`:''}
            <div class="stat"><b>${item.isBarbless?'Jā':'Nē'}</b>bez asmens</div>
            <div class="stat"><b>${item.basePrice||0}</b>cena</div>
          </div>
        </div>
      </div>
      <div class="content">
        ${item.howToGet && item.howToGet.length?`<h3 class="section">Kā iegūt</h3><p>${item.howToGet.map(escapeHtml).join(', ')}</p>`:''}
      </div>
    `;
  }
  if(tab==='luretypes'){
    return `
      <div class="hero">
        <button class="close">&times;</button>
        ${imgTag(item.image, item.title).replace('<img','<img style="width:150px;height:150px;object-fit:contain;background:#08181d;border-radius:4px;padding:8px;"')}
        <div class="htext">
          <h2>${escapeHtml(item.title)}</h2>
        </div>
      </div>
      <div class="content">
        ${item.tags && item.tags.length?`<h3 class="section">Tagi</h3><p>${item.tags.map(t=>escapeHtml(t.replace(/^__fpc-/,'').replace(/-/g,' '))).join(', ')}</p>`:''}
      </div>
    `;
  }
  if(tab==='places'){
    const fishChips = (item.fishIds||[]).map(id=>{
      const fd = (item.fishDetails||[]).find(x=>x.id===id);
      const local = byId.fish[id];
      const title = local? local.title : (fd? fd.name : ('#'+id));
      const img = local? local.image : '';
      if(local){
        return `<div class="chip" data-open="fish:${id}">${img?`<img src="${img}">`:`<div class="noimg"></div>`}${escapeHtml(title)}</div>`;
      }
      return `<div class="chip"><div class="noimg"></div>${escapeHtml(title)}</div>`;
    }).join('');
    return `
      <div class="hero">
        <button class="close">&times;</button>
        ${imgTag(item.image, item.title).replace('<img','<img style="width:150px;height:150px;object-fit:cover;background:#08181d;border-radius:4px;padding:0;"')}
        <div class="htext">
          <h2>${escapeHtml(item.title)}</h2>
          <div class="latin">${escapeHtml(item.locationName||'')}${item.type?' &middot; '+escapeHtml(item.type):''}</div>
          <div class="stats">
            ${item.baseLevel?`<div class="stat"><b>${item.baseLevel}</b>min. līmenis</div>`:''}
            <div class="stat"><b>${(item.fishIds||[]).length}</b>zivju sugas</div>
            <div class="stat"><b>${(item.monsterFishIds||[]).length}</b>trofeju zivis</div>
          </div>
        </div>
      </div>
      <div class="content">
        <h3 class="section">Zivis šajā vietā</h3>
        <div class="chip-row">${fishChips || '<span style="color:var(--ink-dim);font-size:12.5px;">nav zināms</span>'}</div>
      </div>
    `;
  }
  return '';
}

document.getElementById('searchBox').oninput = (e)=>{ state.query = e.target.value; render(); };

// meta line + banner about partial data
const m = DATA.meta;
document.getElementById('metaLine').textContent =
  `zivis ${DATA.fish.length}/${m.fishTotal} · ēsmas ${DATA.baits.length}/${m.baitsTotal} · lūri ${DATA.lures.length}/${m.luresTotal}`;

document.getElementById('dataBanner').innerHTML =
  `<b>Piezīme:</b> šobrīd ielādēta datu daļa — zivis ${DATA.fish.length} no ${m.fishTotal}, ēsmas ${DATA.baits.length} no ${m.baitsTotal}, ` +
  `lūri ${DATA.lures.length} no ${m.luresTotal}, āķi ${DATA.hooks.length} no ${m.hooksTotal}, lūru tipi ${DATA.luretypes.length} no ${m.luretypesTotal}, ` +
  `vietas ${DATA.places.length} no ${m.placesTotal}. Lai papildinātu, atsūti nākamās API lapas (page=2, page=3...) — es tās sapludināšu šajā failā.`;

render();
</script>
</body>
